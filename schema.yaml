components:
  schemas:
    ComplaintRead:
      type: object
      description: Serializer for reading complaints (RESPONSE only)
      properties:
        id:
          type: integer
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/StudentBasic'
          readOnly: true
        meal_log:
          type: integer
          readOnly: true
          description: Shikoyat qilinayotgan ovqat yozuvi
        meal_type:
          type: string
          readOnly: true
        meal_type_display:
          type: string
          readOnly: true
        meal_date:
          type: string
          format: date-time
          readOnly: true
        complaint_text:
          type: string
          readOnly: true
        image:
          type: string
          format: uri
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        admin_response:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - admin_response
      - complaint_text
      - created_at
      - id
      - image
      - meal_date
      - meal_log
      - meal_type
      - meal_type_display
      - status
      - status_display
      - student
      - updated_at
    ComplaintStatistics:
      type: object
      description: Response for complaint statistics endpoint
      properties:
        total_complaints:
          type: integer
        by_status:
          $ref: '#/components/schemas/StatusBreakdown'
        by_meal_type:
          $ref: '#/components/schemas/MealTypeBreakdown'
      required:
      - by_meal_type
      - by_status
      - total_complaints
    ComplaintStats:
      type: object
      description: Complaint statistics by status
      properties:
        pending:
          type: integer
        reviewed:
          type: integer
        resolved:
          type: integer
        rejected:
          type: integer
      required:
      - pending
      - rejected
      - resolved
      - reviewed
    CountsByType:
      type: object
      description: Meal counts by type
      properties:
        breakfast:
          type: integer
        lunch:
          type: integer
        dinner:
          type: integer
      required:
      - breakfast
      - dinner
      - lunch
    DailyBreakdown:
      type: object
      properties:
        date:
          type: string
          format: date
        total:
          type: integer
        breakfast:
          type: integer
        lunch:
          type: integer
        dinner:
          type: integer
      required:
      - breakfast
      - date
      - dinner
      - lunch
      - total
    DashboardResponse:
      type: object
      description: Main dashboard response serializer
      properties:
        timestamp:
          type: string
          format: date-time
        students:
          $ref: '#/components/schemas/StudentStats'
        meals:
          $ref: '#/components/schemas/MealStats'
        orders:
          $ref: '#/components/schemas/OrderStats'
        complaints:
          $ref: '#/components/schemas/ComplaintStats'
      required:
      - complaints
      - meals
      - orders
      - students
      - timestamp
    DateRangeInfo:
      type: object
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        days:
          type: integer
      required:
      - days
      - end
      - start
    DateRangeResponse:
      type: object
      properties:
        date_range:
          $ref: '#/components/schemas/DateRangeInfo'
        filters_applied:
          type: object
          additionalProperties: {}
        summary:
          $ref: '#/components/schemas/DateRangeSummary'
        daily_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/DailyBreakdown'
      required:
      - daily_breakdown
      - date_range
      - filters_applied
      - summary
    DateRangeSummary:
      type: object
      properties:
        total_meals:
          type: integer
        unique_students:
          type: integer
