        similarity_score:
          type: number
          format: double
        existing_log:
          allOf:
          - $ref: '#/components/schemas/MealLog'
          description: Existing meal log if duplicate
      required:
      - message
      - success
    Filters:
      type: object
      description: Applied filters
      properties:
        meal_type:
