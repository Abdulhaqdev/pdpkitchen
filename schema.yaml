      type: object
      description: Serializer for logging meals via face recognition
      properties:
        image:
          type: string
          format: binary
          description: Upload a face image
        meal_type:
          allOf:
          - $ref: '#/components/schemas/MealTypeEnum'
          description: |-
            Type of meal (BREAKFAST, LUNCH, DINNER)

            * `BREAKFAST` - Breakfast
            * `LUNCH` - Lunch
            * `DINNER` - Dinner
      required:
      - image
      - meal_type
