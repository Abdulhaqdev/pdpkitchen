        enrollment_date:
          type: string
          format: date
        until_date:
          type: string
          format: date
        days_since_last_meal:
          type: integer
          nullable: true
          description: Days since last meal, null if never ate
        last_meal_date:
          type: string
          format: date-time
          nullable: true
        total_meals:
          type: integer
          description: Total meals in their entire history
      required:
      - course
      - days_since_last_meal
      - enrollment_date
      - id
      - last_meal_date
      - name
      - pinfl
      - student_type
      - total_meals
      - until_date
    LoginRequest:
