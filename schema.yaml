openapi: 3.0.3
info:
  title: PDP Kitchen Management API
  version: 1.0.0
  description: API documentation for PDP Kitchen Management System
paths:
  /api/dashboard/dashboard/:
    get:
      operationId: dashboard_dashboard_retrieve
      description: 'Returns all statistics in a single response: students, meals,
        orders, complaints'
      summary: Get consolidated dashboard statistics
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
          description: ''
  /api/export/export-to-excel/:
    get:
      operationId: export_export_to_excel_retrieve
      description: Export with lazy pandas import
      summary: Export to Excel
      tags:
      - Meals
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          description: Excel file download
  /api/login/:
    post:
      operationId: login_create
      description: Log in with username and password to get access and refresh tokens
      summary: Log in and get JWT tokens
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          '*/*':
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                SuccessfulLogin:
                  value:
                    access: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                    refresh: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                  summary: Example of a successful login response
                  description: Response containing access and refresh tokens
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidCredentials:
                  value:
                    detail: Invalid credentials
                  summary: Example of an invalid credentials response
                  description: Response indicating invalid username or password
          description: ''
  /api/meal-orders/complaints/:
    get:
      operationId: meal_orders_complaints_list
      description: Staff can view all complaints with filtering options
      summary: List all complaints
      parameters:
      - in: query
        name: course
        schema:
          type: integer
        description: Filter by course
      - in: query
        name: meal_type
        schema:
          type: string
        description: Filter by meal type
      - in: query
        name: pinfl
        schema:
          type: string
        description: Filter by student PINFL
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status (PENDING, REVIEWED, RESOLVED, REJECTED)
      - in: query
        name: student_type
        schema:
          type: string
        description: Filter by student type
      tags:
      - Complaints
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComplaintRead'
          description: ''
  /api/meal-orders/complaints/{id}/:
    get:
      operationId: meal_orders_complaints_retrieve
      description: Staff can view complaint details
      summary: Retrieve a complaint
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this complaint model.
        required: true
      tags:
      - Complaints
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintRead'
          description: ''
  /api/meal-orders/complaints/{id}/update-status/:
    patch:
      operationId: meal_orders_complaints_update_status_partial_update
      description: Staff can update complaint status and add admin response
      summary: Update complaint status
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this complaint model.
        required: true
      tags:
      - Complaints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedComplaintUpdateStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedComplaintUpdateStatusRequest'
          '*/*':
            schema:
              $ref: '#/components/schemas/PatchedComplaintUpdateStatusRequest'
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintRead'
          description: ''
  /api/meal-orders/complaints/statistics/:
    get:
      operationId: meal_orders_complaints_statistics_retrieve
      description: Get statistics about complaints by status
      summary: Get complaint statistics
      tags:
      - Complaints
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintStatistics'
          description: ''
  /api/meal-orders/menu/:
    get:
      operationId: meal_orders_menu_list
      description: Get all menus ordered by date descending
      summary: List all menus
      tags:
      - Weekly Menu
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeeklyMenu'
          description: ''
    post:
      operationId: meal_orders_menu_create
      description: Create a new menu for a specific date
      summary: Create menu for a date
      tags:
      - Weekly Menu
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyMenuCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WeeklyMenuCreateRequest'
          '*/*':
            schema:
              $ref: '#/components/schemas/WeeklyMenuCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyMenuCreate'
          description: ''
  /api/meal-orders/menu/{menu_date}/:
    get:
      operationId: meal_orders_menu_retrieve
      description: Retrieve menu for a specific date (YYYY-MM-DD)
      summary: Get menu by date
      parameters:
      - in: path
        name: menu_date
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        required: true
      tags:
      - Weekly Menu
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyMenu'
          description: ''
    put:
      operationId: meal_orders_menu_update
      description: Update all fields of a menu
      summary: Update menu
      parameters:
      - in: path
        name: menu_date
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        required: true
      tags:
      - Weekly Menu
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyMenuCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WeeklyMenuCreateRequest'
          '*/*':
            schema:
              $ref: '#/components/schemas/WeeklyMenuCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyMenuCreate'
          description: ''
    patch:
      operationId: meal_orders_menu_partial_update
      description: Update specific fields of a menu
      summary: Partial update menu
      parameters:
      - in: path
        name: menu_date
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        required: true
      tags:
      - Weekly Menu
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWeeklyMenuCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWeeklyMenuCreateRequest'
          '*/*':
            schema:
              $ref: '#/components/schemas/PatchedWeeklyMenuCreateRequest'
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyMenuCreate'
          description: ''
    delete:
      operationId: meal_orders_menu_destroy
      description: Delete a menu for a specific date
      summary: Delete menu
      parameters:
      - in: path
        name: menu_date
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        required: true
      tags:
      - Weekly Menu
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/meal-orders/menu/next-week/:
    get:
      operationId: meal_orders_menu_next_week_retrieve
      description: Get menu for the next week (Monday to Sunday)
      summary: Get next week's menu
      tags:
      - Weekly Menu
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekMenuResponse'
          description: ''
  /api/meal-orders/menu/week/:
    get:
      operationId: meal_orders_menu_week_retrieve
      description: Get menu for the current week (Monday to Sunday)
      summary: Get current week's menu
      tags:
      - Weekly Menu
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekMenuResponse'
          description: ''
  /api/meal-orders/orders/by-date/:
    get:
      operationId: meal_orders_orders_by_date_retrieve
      description: |-
        Get meal orders for a specific date with statistics.

        Query Parameters:
        - date: Date in YYYY-MM-DD format (required)
        - meal_type: Filter by meal type (BREAKFAST, LUNCH, DINNER)
        - student_type: Filter by student type (SCHOLARSHIP, CONTRACT)
        - course: Filter by course number
      summary: Get orders by date
      parameters:
      - in: query
        name: course
        schema:
          type: integer
        description: Filter by course
      - in: query
        name: date
        schema:
          type: string
        description: Date (YYYY-MM-DD)
        required: true
      - in: query
        name: meal_type
        schema:
          type: string
        description: Filter by meal type
      - in: query
        name: student_type
        schema:
          type: string
        description: Filter by student type
      tags:
      - Meal Orders
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatistics'
          description: ''
  /api/meal-orders/orders/pending-meals/:
    get:
      operationId: meal_orders_orders_pending_meals_retrieve
      description: |-
        Get list of students who placed meal orders but have not received their meals yet.

        Query Parameters:
        - date: Date in YYYY-MM-DD format (required)
        - meal_type: Filter by meal type (BREAKFAST, LUNCH, DINNER) (optional)
        - student_type: Filter by student type (SCHOLARSHIP, CONTRACT)
        - course: Filter by course number
      summary: Get students with pending meals
      parameters:
      - in: query
        name: course
        schema:
          type: integer
        description: Filter by course
      - in: query
        name: date
        schema:
          type: string
        description: Date (YYYY-MM-DD)
        required: true
      - in: query
        name: meal_type
        schema:
          type: string
        description: BREAKFAST, LUNCH, or DINNER
      - in: query
        name: student_type
        schema:
          type: string
        description: Filter by student type
      tags:
      - Meal Orders
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingMealsResponse'
          description: ''
  /api/meal-orders/orders/students-who-ordered/:
    get:
      operationId: meal_orders_orders_students_who_ordered_retrieve
      description: |-
        Get detailed list of students who ordered meals for a specific date and meal type.

        Query Parameters:
        - date: Date in YYYY-MM-DD format (required)
        - meal_type: Meal type to filter (BREAKFAST, LUNCH, DINNER) (required)
        - student_type: Filter by student type (SCHOLARSHIP, CONTRACT)
        - course: Filter by course number
      summary: Get students who ordered
      parameters:
      - in: query
        name: course
        schema:
          type: integer
        description: Filter by course
      - in: query
        name: date
        schema:
          type: string
        description: Date (YYYY-MM-DD)
        required: true
      - in: query
        name: meal_type
        schema:
          type: string
        description: BREAKFAST, LUNCH, or DINNER
        required: true
      - in: query
        name: student_type
        schema:
          type: string
        description: Filter by student type
      tags:
      - Meal Orders
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentsWhoOrderedResponse'
          description: ''
  /api/meals/:
    get:
      operationId: meals_list
      description: List meal logs - cached for 30 seconds
      summary: List all meal logs
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Meals
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMealLogListList'
          description: ''
    post:
      operationId: meals_create
      description: Create meal log - invalidate cache
      summary: Create a new meal log
      tags:
      - Meals
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MealLogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MealLogRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealLog'
          description: ''
  /api/meals/{id}/:
    get:
      operationId: meals_retrieve
      description: Optimized ViewSet for meal logs
      summary: Retrieve a meal log
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this meals log model.
        required: true
      tags:
      - Meals
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealLog'
          description: ''
    put:
      operationId: meals_update
      description: Optimized ViewSet for meal logs
      summary: Update a meal log
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this meals log model.
        required: true
      tags:
      - Meals
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MealLogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MealLogRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealLog'
          description: ''
    patch:
      operationId: meals_partial_update
      description: Optimized ViewSet for meal logs
      summary: Partially update a meal log
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this meals log model.
        required: true
      tags:
      - Meals
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMealLogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMealLogRequest'
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealLog'
          description: ''
    delete:
      operationId: meals_destroy
      description: Optimized ViewSet for meal logs
      summary: Delete a meal log
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this meals log model.
        required: true
      tags:
      - Meals
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/meals/by-date/:
    get:
      operationId: meals_by_date_retrieve
      description: Optimized meals by date query
      summary: Get meals by date with filtering
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Date (YYYY-MM-DD)
      - in: query
        name: meal_type
        schema:
          type: string
        description: Filter by meal type (BREAKFAST, LUNCH, DINNER)
      - in: query
        name: pinfl
        schema:
          type: string
        description: Filter by student PINFL
      tags:
      - Meals
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealsByDateResponse'
          description: ''
  /api/meals/log-by-face/:
    post:
      operationId: meals_log_by_face_create
      description: Optimized face recognition meal logging
      summary: Log meal by face recognition
      tags:
      - Meals
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FaceMealLogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FaceMealLogRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceMealLogResponse'
          description: ''
        '400':
          description: Bad request
        '404':
          description: No matching student
        '409':
          description: Already logged
  /api/search-students/:
    get:
      operationId: search_students_list
      description: Search students by first name, last name, middle name (partial)
        or PINFL (exact match).
      summary: Search students
      parameters:
      - in: query
        name: first_name
        schema:
          type: string
        description: Partial match on first name
      - in: query
        name: last_name
        schema:
          type: string
        description: Partial match on last name
      - in: query
        name: middle_name
        schema:
          type: string
        description: Partial match on middle name
      - in: query
        name: pinfl
        schema:
          type: string
        description: Exact match on PINFL
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Students
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentList'
          description: ''
  /api/search-students/{id}/:
    get:
      operationId: search_students_retrieve
      description: |-
        ViewSet for searching students by first name, last name, middle name, or PINFL.
        Accessible by staff and superusers only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this students model.
        required: true
      tags:
      - search-students
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentList'
          description: ''
  /api/self/:
    get:
      operationId: self_retrieve
      description: Retrieve the profile information of the currently authenticated
        user
      summary: Get authenticated user's profile
      tags:
      - User
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Self'
          description: ''
  /api/stats/by-range/:
    get:
      operationId: stats_by_range_retrieve
      description: |-
        Get detailed meal statistics for a custom date range with filtering.

        Query Parameters:
        - start_date: Start date in YYYY-MM-DD format (required)
        - end_date: End date in YYYY-MM-DD format (default: today)
        - meal_type: Filter by meal type (BREAKFAST, LUNCH, DINNER)
        - student_type: Filter by student type (SCHOLARSHIP, CONTRACT)
        - course: Filter by course number
      summary: Get statistics by date range
      parameters:
      - in: query
        name: course
        schema:
          type: integer
        description: Filter by course number
      - in: query
        name: end_date
        schema:
          type: string
        description: 'End date (default: today)'
      - in: query
        name: meal_type
        schema:
          type: string
        description: Filter by meal type
      - in: query
        name: start_date
        schema:
          type: string
        description: Start date (YYYY-MM-DD)
        required: true
      - in: query
        name: student_type
        schema:
          type: string
        description: Filter by student type
      tags:
      - Meal Statistics
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateRangeResponse'
          description: ''
  /api/stats/student-history/:
    get:
      operationId: stats_student_history_retrieve
      description: |-
        Get detailed meal history for a specific student.

        Query Parameters:
        - pinfl: Student PINFL (required)
        - start_date: Filter from date (YYYY-MM-DD)
        - end_date: Filter to date (YYYY-MM-DD)
      summary: Get student meal history
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
        description: End date (YYYY-MM-DD)
      - in: query
        name: pinfl
        schema:
          type: string
        description: Student PINFL
        required: true
      - in: query
        name: start_date
        schema:
          type: string
        description: Start date (YYYY-MM-DD)
      tags:
      - Meal Statistics
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentHistoryResponse'
          description: ''
  /api/stats/students-not-eating/:
    get:
      operationId: stats_students_not_eating_retrieve
      description: |-
        Get list of active enrolled students who are NOT eating meals.

        This helps identify:
        - Students who never logged any meal
        - Students who haven't eaten in specified number of days

        Query Parameters:
        - days: Consider students who haven't eaten in last X days (default: 7)
        - course: Filter by course number
        - student_type: Filter by student type (SCHOLARSHIP, CONTRACT)
        - limit: Maximum number of students to return (default: 50, max: 500)
      summary: Get students who are not eating
      parameters:
      - in: query
        name: course
        schema:
          type: integer
        description: Filter by course
      - in: query
        name: days
        schema:
          type: integer
        description: 'Days of inactivity (default: 7)'
      - in: query
        name: limit
        schema:
          type: integer
        description: 'Max students (default: 50)'
      - in: query
        name: student_type
        schema:
          type: string
        description: Filter by student type
      tags:
      - Meal Statistics
      security:
      - jwtAuth: []
      - basicAuth: []
      responses:
        '200':
