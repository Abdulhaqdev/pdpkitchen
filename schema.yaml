          $ref: '#/components/schemas/MealTypeBreakdown'
        average_meals_per_day:
          type: number
          format: double
        average_meals_per_student:
          type: number
          format: double
          description: Average meals per student who ate during this period
      required:
      - average_meals_per_day
      - average_meals_per_student
      - by_meal_type
      - total_meals
      - unique_students
    ErrorResponse:
      type: object
      description: Serializer for error responses
      properties:
        detail:
          type: string
          description: Error detail message
        error:
          type: string
          description: Error message
